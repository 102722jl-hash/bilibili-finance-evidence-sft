<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>事件证据链 · UI 案例</title>
  <style>
    :root{--ink:#17212a;--muted:#66727d;--line:#d8dee4;--bg:#f1f4f6;--paper:#fff;--nav:#16232d;--green:#147a62;--green-bg:#e6f3ef;--blue:#2d68a1;--blue-bg:#e9f1f9;--violet:#6953a3;--violet-bg:#f0edfa;--amber:#a56412;--amber-bg:#fff2dc;--red:#a94040;--red-bg:#fbeaea}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;letter-spacing:0}button{font:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr) 330px;grid-template-rows:58px minmax(0,1fr)}
    header{grid-column:1/-1;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #0c151c}.brand{display:flex;align-items:center;gap:10px}.mark{width:30px;height:30px;display:grid;place-items:center;background:#203541;border:1px solid #506b7b;color:#9fd7c6;font-size:12px;font-weight:700}.brand strong{font-size:14px}.crumb{color:#aebbc4;font-size:12px;margin-left:8px}.head-actions{display:flex;align-items:center;gap:8px}.version-switch{display:flex;border:1px solid #506471;border-radius:4px;overflow:hidden}.version-btn{height:30px;border:0;border-right:1px solid #506471;background:#223541;color:#bdc8cf;padding:0 11px;font-size:11px}.version-btn:last-child{border-right:0}.version-btn.active{background:#176d59;color:#fff}.head-btn{height:32px;border:1px solid #506471;background:#223541;color:#fff;border-radius:4px;padding:0 10px}.head-btn.active{background:#176d59;border-color:#398d75}
    aside.cases{background:#e8edf0;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}.side-title{padding:2px 9px 10px;color:#78848e;font-size:11px;font-weight:700}.case-search{width:100%;height:34px;border:1px solid #ccd5dc;background:#fff;border-radius:4px;padding:0 9px;margin-bottom:10px}.case-item{width:100%;border:1px solid transparent;background:transparent;text-align:left;padding:10px;border-radius:5px;margin-bottom:5px;color:#42515d}.case-item.active{background:#fff;border-color:#afd4c8;box-shadow:0 3px 10px rgba(28,54,47,.07)}.case-id{font-size:10px;color:var(--green);font-weight:700;margin-bottom:4px}.case-name{font-size:13px;font-weight:700;line-height:1.45}.case-meta{font-size:10px;color:#76828c;margin-top:5px}
    main{padding:18px;overflow:auto;min-width:0}.case-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:14px}.eyebrow{color:var(--green);font-size:11px;font-weight:700;margin-bottom:5px}h1{font-size:23px;margin:0 0 6px}.desc{color:var(--muted);font-size:13px;line-height:1.7;margin:0}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{font-size:11px;padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:#fff;white-space:nowrap}.badge.ok{color:var(--green);background:var(--green-bg);border-color:#b8ddd1}.badge.warn{color:var(--amber);background:var(--amber-bg);border-color:#ead09d}
    .tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}.tab{border:0;background:transparent;color:#62707b;padding:10px 13px;border-bottom:3px solid transparent}.tab.active{color:#172832;border-bottom-color:var(--green);font-weight:700}.view{display:none}.view.active{display:block}.claim{background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:5px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.7}.claim small{display:block;color:var(--muted);font-size:10px;font-weight:700;margin-bottom:3px}
    .lane{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:11px;overflow:hidden}.lane-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#f8fafb;border-bottom:1px solid var(--line)}.lane-name{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}.lane-dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}.lane.author .lane-dot{background:var(--violet)}.lane.world .lane-dot{background:var(--green)}.lane-summary{font-size:10px;color:var(--muted)}.flow{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:24px;padding:13px;overflow:auto}.node{position:relative;border:1px solid var(--line);border-top:3px solid var(--blue);background:#fff;border-radius:5px;padding:10px;text-align:left;min-height:112px;color:var(--ink);transition:opacity .15s,box-shadow .15s}.lane.author .node{border-top-color:var(--violet)}.lane.world .node{border-top-color:var(--green)}.node:not(:last-child):after{content:">";position:absolute;right:-17px;top:45%;color:#89959e;font-weight:700}.node.omitted{opacity:.38}.node.local{box-shadow:0 0 0 2px #e3a637;border-color:#d4911f;opacity:1}.node:hover,.node.selected{box-shadow:0 0 0 2px #9dccbd;border-color:#78b6a3;opacity:1}.node-step{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-bottom:7px}.node-text{font-size:12px;line-height:1.55}.node-status{display:inline-block;margin-top:8px;font-size:9px;padding:3px 5px;border-radius:3px;background:#eef2f4;color:#64717c}.node-status.confirmed{background:var(--green-bg);color:var(--green)}.node-status.partial{background:var(--amber-bg);color:var(--amber)}.node-status.unsupported{background:var(--red-bg);color:var(--red)}
    .coverage{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:14px}.cover{border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px;text-align:center;font-size:10px;color:var(--muted)}.cover.done{border-color:#acd6ca;background:var(--green-bg);color:var(--green)}.dialogue{background:#fff;border:1px solid var(--line);border-radius:6px;padding:15px}.turn{display:grid;grid-template-columns:34px 1fr 90px;gap:10px;position:relative;padding-bottom:18px}.turn:last-child{padding-bottom:0}.turn:not(:last-child):before{content:"";position:absolute;left:16px;top:31px;bottom:0;border-left:1px solid #bfc8cf}.turn-no{width:32px;height:32px;border:1px solid #bdc7ce;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:11px;z-index:1}.turn.current .turn-no,.turn.done .turn-no{background:var(--green);border-color:var(--green);color:#fff}.turn-q{font-size:13px;line-height:1.55}.turn-tags{color:var(--muted);font-size:10px;margin-top:3px}.intent{text-align:right;font-size:10px;color:var(--blue);padding-top:6px}
    aside.inspector{background:#fff;border-left:1px solid var(--line);overflow:auto}.inspect-head{padding:14px;border-bottom:1px solid var(--line);background:#f8fafb}.inspect-head strong{font-size:13px}.inspect-body{padding:14px}.ref{font-family:Consolas,monospace;font-size:10px;color:var(--green);margin-bottom:7px}.inspect-title{font-size:15px;line-height:1.6;font-weight:700;margin-bottom:12px}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.section:first-of-type{border-top:0;padding-top:0}.section-label{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:5px}.section-text{font-size:12px;line-height:1.7}.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.status-box{padding:9px;background:#f5f7f8;border:1px solid var(--line);border-radius:4px}.status-box span{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.status-box strong{font-size:11px}.source{background:#f6f9f8;border:1px solid #d7e5e0;border-radius:4px;padding:10px;margin-top:7px}.source-name{font-size:11px;font-weight:700;margin-bottom:4px}.source-text{font-size:11px;line-height:1.6;color:#52616c}
    .tool-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.select{height:34px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:0 9px;min-width:260px}.count{font-size:11px;color:var(--muted)}.qa-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}.qa-list{background:#fff;border:1px solid var(--line);border-radius:5px;padding:7px;max-height:620px;overflow:auto}.qa-button{width:100%;border:1px solid transparent;background:transparent;text-align:left;border-radius:4px;padding:9px;margin-bottom:4px}.qa-button.active{background:var(--green-bg);border-color:#afd7cb}.qa-button-id{font-size:9px;color:var(--green);font-weight:700}.qa-button-q{font-size:11px;line-height:1.5;margin-top:3px}.qa-detail{background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}.qa-head{padding:12px;border-bottom:1px solid var(--line);background:#f8fafb}.qa-head-id{font-size:10px;color:var(--green);font-weight:700}.qa-head-q{font-size:14px;font-weight:700;line-height:1.6;margin-top:4px}.qa-body{padding:13px}.kv{display:grid;grid-template-columns:100px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #edf0f2;font-size:11px;line-height:1.65}.kv-key{color:var(--muted)}.codebox{white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;background:#111a21;color:#dce6ec;border-radius:4px;padding:12px;font:10px/1.65 Consolas,monospace}.source-card{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;overflow:hidden}.source-card-head{padding:11px 12px;background:#f8fafb;border-bottom:1px solid var(--line)}.source-card-title{font-size:12px;font-weight:700}.source-card-meta,.source-url{font-size:9px;color:var(--muted);margin-top:3px;word-break:break-all}.source-url{color:var(--blue)}.context-card{padding:11px 12px;border-bottom:1px solid #edf0f2}.context-id{font:9px Consolas;color:var(--green);margin-bottom:4px}.context-text{font-size:11px;line-height:1.65}.link-row{display:grid;grid-template-columns:110px 1fr 100px;gap:8px;padding:8px 12px;background:#fbfcfd;border-top:1px solid var(--line);font-size:10px;line-height:1.5}.path-summary{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .path-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.7fr);gap:12px}.path-side{display:grid;gap:10px;align-content:start}.info-panel{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px}.info-panel h3{font-size:12px;margin:0 0 8px}.info-panel p{font-size:11px;line-height:1.65;color:#53616c;margin:0}.turn-card{display:grid;grid-template-columns:34px minmax(0,1fr) 90px;gap:10px;position:relative;padding:3px 0 18px}.turn-card:not(:last-child):before{content:"";position:absolute;left:16px;top:34px;bottom:0;border-left:1px solid #bfc8cf}.turn-main{min-width:0}.turn-answer{margin-top:7px;padding:8px 10px;background:#f6f9f8;border-left:3px solid var(--green);font-size:11px;line-height:1.65}.turn-audit{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.audit-chip{font-size:9px;padding:3px 5px;border:1px solid var(--line);border-radius:3px;background:#fff;color:#5d6a75}.supervision-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.supervision-card{border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:5px;padding:9px;background:#fff}.supervision-card.author{border-top-color:var(--violet)}.supervision-card.world{border-top-color:var(--green)}.supervision-card h4{margin:0 0 7px;font-size:11px}.supervision-step{font-size:10px;line-height:1.55;padding:5px 0;border-top:1px solid #edf0f2}.supervision-step:first-of-type{border-top:0}.answer-block{background:#f2f7f5;border:1px solid #d4e5df;border-radius:5px;padding:11px;font-size:12px;line-height:1.75;margin:10px 0}.fold{margin-top:10px;border:1px solid var(--line);border-radius:4px;overflow:hidden}.fold summary{padding:9px 11px;background:#f8fafb;font-size:11px;font-weight:700;cursor:pointer}.fold-body{padding:10px}.dataset-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.stat{padding:9px;background:#fff;border:1px solid var(--line);border-radius:4px}.stat strong{display:block;font-size:16px}.stat span{font-size:9px;color:var(--muted)}
    @media(max-width:1100px){.app{grid-template-columns:72px minmax(0,1fr) 300px}.cases{padding-inline:7px!important}.side-title,.case-name,.case-meta,.case-search{display:none}.case-item{padding:8px}.case-id{font-size:8px;overflow:hidden}.flow{grid-template-columns:repeat(4,200px)}}@media(max-width:760px){.app{display:block}.crumb{display:none}aside.cases{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.case-item{min-width:100px;margin:0 4px}.case-name{display:block;font-size:10px}aside.inspector{border-left:0;border-top:1px solid var(--line)}main{padding:12px}.flow{display:block}.node{margin-bottom:25px;min-height:0}.node:not(:last-child):after{content:"v";right:50%;top:auto;bottom:-19px}.coverage{grid-template-columns:repeat(3,1fr)}.qa-grid{grid-template-columns:1fr}.qa-list{max-height:240px}.link-row{grid-template-columns:1fr}.select{min-width:0;width:100%}}
  </style>
</head>
<body>
  <div class="app">
    <header><div class="brand"><div class="mark">EC</div><strong>事件证据链工作台</strong><span class="crumb">案例中心</span></div><div class="head-actions"><div class="version-switch" aria-label="数据版本"><button class="version-btn active" data-dataset-key="merged">合并版</button><button class="version-btn" data-dataset-key="v41">V4.1</button><button class="version-btn" data-dataset-key="v5">V5</button></div><button class="head-btn active">案例审计</button></div></header>
    <aside class="cases"><div class="side-title">10 个事件案例</div><input class="case-search" placeholder="搜索案例"><button class="case-item active"><div class="case-id">CASE-GRAIN</div><div class="case-name">中国大豆进口依赖</div><div class="case-meta">9 QA · 5 路径 · 已审核</div></button><button class="case-item"><div class="case-id">CASE-HOUSING</div><div class="case-name">房地产周期与政策</div><div class="case-meta">9 QA · 5 路径</div></button><button class="case-item"><div class="case-id">CASE-JAPAN</div><div class="case-name">日本经济转型</div><div class="case-meta">9 QA · 5 路径</div></button><button class="case-item"><div class="case-id">CASE-KOREA</div><div class="case-name">韩国财阀结构</div><div class="case-meta">9 QA · 5 路径</div></button><button class="case-item"><div class="case-id">CASE-VANKE</div><div class="case-name">万科控制权事件</div><div class="case-meta">9 QA · 验证集</div></button></aside>
    <main>
      <div class="case-head"><div><div class="eyebrow">CASE-GRAIN · CHINA_GRAIN_FINANCE</div><h1>中国大豆进口依赖与产业传导</h1><p class="desc">时间范围：1990s–2009 · 作者材料 2 段 · 外部材料 2 段 · 12 个命题节点</p></div><div class="badges"><span class="badge ok">已审核</span><span class="badge">9 个问题</span><span class="badge">5 条对话路径</span><span class="badge warn">存在证据边界</span></div></div>
      <nav class="tabs"><button class="tab active" data-view="chains">三链同步</button><button class="tab" data-view="dialogue">连续追问</button><button class="tab" data-view="sources">来源覆盖</button><button class="tab" data-view="training">训练样本</button></nav>
      <section class="view active" id="chains"><div class="claim"><small>作者中心主张</small>关键粮食产业必须保持自主调控能力，相关金融和舆论博弈仍会持续。</div><div id="lanes"></div></section>
      <section class="view" id="dialogue"><div class="tool-row"><select class="select" id="pathSelect"></select><span class="count" id="pathCount"></span></div><div id="dialogueContent"></div></section>
      <section class="view" id="sources"><div id="sourcesContent"></div></section>
      <section class="view" id="training"><div class="qa-grid"><div class="qa-list" id="qaList"></div><div class="qa-detail" id="qaDetail"></div></div></section>
    </main>
    <aside class="inspector"><div class="inspect-head"><strong>节点审计详情</strong></div><div class="inspect-body" id="inspector"></div></aside>
  </div>
  <script src="sft-cases-data.js"></script>
  <script src="sft-cases-workbench.js"></script>
</body>
</html>
